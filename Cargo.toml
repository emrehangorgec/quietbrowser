[package]
name = "quietbrowser"
version = "0.2.0"
edition = "2024"
description = "A browser for coding agents on Windows that never steals your focus"
license = "MIT"
repository = "https://github.com/emrehangorgec/quietbrowser"
keywords = ["browser", "agent", "webview2", "windows", "focus"]

[dependencies]
serde_json = "1.0.154"
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_Security"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <title>quietbrowser: you keep typing in your editor while the agent fills a form in a browser window behind it</title>
  <style>
    :root {
      --desk: #eef1f6; --desk2: #e3e8f0; --win: #ffffff; --bar: #f3f4f6; --line: #d6dbe3;
      --text: #1f2933; --muted: #6b7684; --accent: #2563eb; --accent-soft: #dbe7ff;
      --term: #0f172a; --term-text: #cbd5e1; --term-cmd: #f8fafc; --term-add: #4ade80; --prompt: #60a5fa;
      --ok: #15803d; --input: #ffffff; --btn: #111827; --btn-text: #ffffff; --chip: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --desk: #0b0f17; --desk2: #121826; --win: #171c26; --bar: #1e2430; --line: #2b3342;
        --text: #e5e9f0; --muted: #8b95a5; --accent: #60a5fa; --accent-soft: #1d2b45;
        --term: #05080f; --term-text: #94a3b8; --term-cmd: #f1f5f9; --term-add: #4ade80; --prompt: #60a5fa;
        --ok: #4ade80; --input: #0f141d; --btn: #e5e9f0; --btn-text: #0b0f17; --chip: #171c26;
      }
    }
    .desk { fill: var(--desk); }
    .win { fill: var(--win); stroke: var(--line); }
    .bar { fill: var(--bar); }
    .t { fill: var(--text); }
    .m { fill: var(--muted); }
    .a { fill: var(--accent); }
    .mono { font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace; }
    .term { fill: var(--term); }
    .tt { fill: var(--term-text); }
    .tc { fill: var(--term-cmd); }
    .tp { fill: var(--prompt); }
    .tadd { fill: var(--term-add); }
    .ok { fill: var(--ok); }
    .field { fill: var(--input); stroke: var(--line); }
    .btn { fill: var(--btn); }
    .btnt { fill: var(--btn-text); }
    .focus { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .chip { fill: var(--chip); stroke: var(--line); }

    /* 12 s loop. Without animation everything shows its final state. */
    .anim { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: steps(1, end); }
    .e1 { animation-name: e1; } @keyframes e1 { 0% { transform: scaleX(0); } 10% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    .e2 { animation-name: e2; } @keyframes e2 { 0%, 18% { transform: scaleX(0); } 32% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    .e3 { animation-name: e3; } @keyframes e3 { 0%, 36% { transform: scaleX(0); } 50% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    .e4 { animation-name: e4; } @keyframes e4 { 0%, 54% { transform: scaleX(0); } 68% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    .e5 { animation-name: e5; } @keyframes e5 { 0%, 72% { transform: scaleX(0); } 90% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    .e1, .e2, .e3, .e4, .e5 { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: linear; transform-box: fill-box; transform-origin: 0 0; }

    .show05 { animation-name: show05; } @keyframes show05 { 0% { opacity: 0; } 6% { opacity: 1; } 100% { opacity: 1; } }
    .show10 { animation-name: show10; } @keyframes show10 { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 1; } }
    .show28 { animation-name: show28; } @keyframes show28 { 0% { opacity: 0; } 28% { opacity: 1; } 100% { opacity: 1; } }
    .show32 { animation-name: show32; } @keyframes show32 { 0% { opacity: 0; } 32% { opacity: 1; } 100% { opacity: 1; } }
    .show42 { animation-name: show42; } @keyframes show42 { 0% { opacity: 0; } 42% { opacity: 1; } 100% { opacity: 1; } }
    .show46 { animation-name: show46; } @keyframes show46 { 0% { opacity: 0; } 46% { opacity: 1; } 100% { opacity: 1; } }
    .show56 { animation-name: show56; } @keyframes show56 { 0% { opacity: 0; } 56% { opacity: 1; } 100% { opacity: 1; } }
    .show60 { animation-name: show60; } @keyframes show60 { 0% { opacity: 0; } 60% { opacity: 1; } 100% { opacity: 1; } }
    .hide10 { animation-name: hide10; } @keyframes hide10 { 0% { opacity: 1; } 10% { opacity: 0; } 100% { opacity: 0; } }

    .caret { animation: caret 12s infinite steps(1, end), blink 1s infinite steps(1, end); }
    @keyframes caret {
      0% { transform: translate(0px, 0px); } 18% { transform: translate(0px, 30px); } 36% { transform: translate(0px, 60px); }
      54% { transform: translate(0px, 90px); } 72% { transform: translate(0px, 120px); } 100% { transform: translate(0px, 120px); }
    }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    .pulse { animation: pulse 2s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .anim, .e1, .e2, .e3, .e4, .e5, .caret, .pulse { animation: none; } }
  </style>

  <defs>
    <clipPath id="c1"><rect class="e1" x="70" y="150" width="300" height="26"/></clipPath>
    <clipPath id="c2"><rect class="e2" x="70" y="180" width="330" height="26"/></clipPath>
    <clipPath id="c3"><rect class="e3" x="70" y="210" width="330" height="26"/></clipPath>
    <clipPath id="c4"><rect class="e4" x="70" y="240" width="330" height="26"/></clipPath>
    <clipPath id="c5"><rect class="e5" x="70" y="270" width="360" height="26"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1220" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect class="desk" x="0" y="0" width="960" height="600" rx="18"/>

  <!-- Browser window, behind -->
  <g filter="url(#shadow)">
    <rect class="win" x="420" y="36" width="510" height="334" rx="10"/>
    <path class="bar" d="M420 46a10 10 0 0 1 10-10h490a10 10 0 0 1 10 10v26H420z"/>
    <circle cx="438" cy="54" r="5" class="m" opacity=".45"/><circle cx="454" cy="54" r="5" class="m" opacity=".45"/><circle cx="470" cy="54" r="5" class="m" opacity=".45"/>
    <text x="490" y="59" font-size="13" class="m">quietbrowser</text>
    <text x="914" y="59" font-size="12" class="m" text-anchor="end">never takes focus</text>
    <rect class="field" x="534" y="84" width="380" height="26" rx="13"/>
    <text x="550" y="102" font-size="12.5" class="m mono">localhost:3000/signup</text>

    <!-- loading state -->
    <g class="anim hide10"><text x="724" y="230" font-size="14" class="m" text-anchor="middle">loading…</text></g>
    <!-- page -->
    <g class="anim show10">
      <text x="548" y="152" font-size="22" font-weight="600" class="t">Sign up</text>
      <text x="548" y="186" font-size="13" class="m">Email</text>
      <rect class="field" x="548" y="194" width="300" height="34" rx="7"/>
      <rect class="field" x="548" y="244" width="18" height="18" rx="4"/>
      <text x="576" y="258" font-size="13.5" class="t">I agree to the terms</text>
      <rect class="btn" x="548" y="278" width="150" height="36" rx="8"/>
      <text x="623" y="301" font-size="13.5" font-weight="600" class="btnt" text-anchor="middle">Create account</text>
    </g>
    <g class="anim show32"><text x="560" y="216" font-size="14" class="t mono">dev@example.com</text></g>
    <g class="anim show46"><path d="M551.5 253 l4.5 4.5 l8 -9" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="anim show60">
      <circle cx="555" cy="342" r="7" class="ok"/>
      <path d="M551.5 342 l2.5 2.5 l4.5 -5" fill="none" stroke="var(--win)" stroke-width="2" stroke-linecap="round"/>
      <text x="570" y="347" font-size="14" font-weight="600" class="ok">Thanks dev@example.com</text>
    </g>
  </g>

  <!-- Agent terminal, behind -->
  <g filter="url(#shadow)">
    <rect class="term" x="506" y="392" width="424" height="160" rx="10"/>
    <text x="524" y="414" font-size="12" class="tt">agent</text>
    <g font-size="13" class="mono">
      <g class="anim show05"><text x="524" y="442"><tspan class="tp">&gt;</tspan><tspan class="tc"> quietbrowser open localhost:3000/signup</tspan></text></g>
      <g class="anim show28"><text x="524" y="464"><tspan class="tp">&gt;</tspan><tspan class="tc"> quietbrowser fill e2 dev@example.com</tspan></text></g>
      <g class="anim show42"><text x="524" y="486"><tspan class="tp">&gt;</tspan><tspan class="tc"> quietbrowser click e3</tspan></text></g>
      <g class="anim show56"><text x="524" y="508"><tspan class="tp">&gt;</tspan><tspan class="tc"> quietbrowser click e4</tspan></text></g>
      <g class="anim show60"><text x="524" y="530" class="tadd">+ text: Thanks dev@example.com</text></g>
    </g>
  </g>

  <!-- Editor, in front and focused -->
  <g filter="url(#shadow)">
    <rect class="win" x="40" y="92" width="452" height="330" rx="10"/>
    <path fill="var(--accent-soft)" d="M40 102a10 10 0 0 1 10-10h432a10 10 0 0 1 10 10v26H40z"/>
    <circle cx="58" cy="110" r="5" fill="#ff5f57"/><circle cx="74" cy="110" r="5" fill="#febc2e"/><circle cx="90" cy="110" r="5" fill="#28c840"/>
    <text x="110" y="115" font-size="13" class="t" font-weight="600">notes.md</text>
    <text x="476" y="115" font-size="12" class="a" text-anchor="end" font-weight="600">you are typing here</text>
    <rect class="focus" x="40" y="92" width="452" height="330" rx="10"/>
    <g font-size="15" class="t mono">
      <text x="70" y="168" clip-path="url(#c1)" font-weight="700"># Release notes</text>
      <text x="70" y="198" clip-path="url(#c2)">* Faster cold start</text>
      <text x="70" y="228" clip-path="url(#c3)">* Export dialog fixed</text>
      <text x="70" y="258" clip-path="url(#c4)">* New keyboard shortcuts</text>
      <text x="70" y="288" clip-path="url(#c5)">Next: write the changelog</text>
    </g>
    <rect class="caret a" x="68" y="153" width="2" height="19"/>
  </g>

  <!-- Status chip -->
  <g>
    <rect class="chip" x="40" y="446" width="400" height="44" rx="22"/>
    <circle class="pulse" cx="66" cy="468" r="6" fill="#22c55e"/>
    <text x="82" y="473" font-size="14.5" class="t"><tspan font-weight="700">Focus stays with you.</tspan><tspan class="m"> 0 steals in 240 commands</tspan></text>
  </g>
  <text x="40" y="530" font-size="13" class="m">The agent drives a real browser behind your window.</text>
  <text x="40" y="550" font-size="13" class="m">Click the window when you want it.</text>
</svg>

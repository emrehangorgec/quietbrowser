name: release

# Builds the binaries for a version tag and attaches them to its GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: quietbrowser.exe
          - os: macos-latest
            asset: quietbrowser-macos
          - os: ubuntu-latest
            asset: quietbrowser-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release
          mkdir -p out && cp target/release/quietbrowser.exe out/${{ matrix.asset }}
      - name: Build (macOS, Intel and Apple Silicon in one file)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p out
          lipo -create -output out/${{ matrix.asset }} \
            target/x86_64-apple-darwin/release/quietbrowser target/aarch64-apple-darwin/release/quietbrowser
      - name: Build (Linux, static)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p out && cp target/x86_64-unknown-linux-musl/release/quietbrowser out/${{ matrix.asset }}
      - name: Check the version
        run: |
          chmod +x out/${{ matrix.asset }}
          test "$(out/${{ matrix.asset }} --version)" = "quietbrowser ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber

name: ci

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: cargo build --release
      - name: Smoke test (WebView2)
        if: runner.os == 'Windows'
        run: python test/smoke.py target/release/quietbrowser.exe --engine webview2
      - name: Smoke test (Chrome)
        if: runner.os == 'Windows'
        run: python test/smoke.py target/release/quietbrowser.exe --engine chrome
      # A fresh runner has never launched Chrome, so Gatekeeper verifies it on the first launch and
      # `open` blocks until that ends. On a normal Mac this happened long ago. Get it done here.
      - name: Let Gatekeeper verify Chrome once
        if: runner.os == 'macOS'
        run: |
          mkdir -p shots
          sudo xattr -dr com.apple.quarantine "/Applications/Google Chrome.app" || true
          perl -e 'alarm 180; exec @ARGV' open -g -a "Google Chrome" --args --headless=new --user-data-dir="$RUNNER_TEMP/warmup" about:blank \
            && echo "open returned" || echo "open did not return"
          sleep 5
          pkill -x "Google Chrome" || true
          sleep 2
          open -a TextEdit
          sleep 3
          screencapture -x shots/1-before-test.png || true
          lsappinfo info -only name "$(lsappinfo front)" || true
      - name: Smoke test with focus check (Chrome)
        if: runner.os == 'macOS'
        run: |
          python test/smoke.py target/release/quietbrowser
          # the test must have used the background launch, not the fallback
          ! grep -q "starting the browser binary directly" "$HOME/Library/Application Support/quietbrowser/log.txt"
      - name: Screenshot after the test
        if: always() && runner.os == 'macOS'
        run: screencapture -x shots/2-end.png || true
      - name: Upload screenshots
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-screens
          path: shots/
      - name: Smoke test (Chrome under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python test/smoke.py target/release/quietbrowser
      - name: Log on failure
        if: failure()
        run: |
          for f in "$LOCALAPPDATA/quietbrowser/log.txt" "$HOME/Library/Application Support/quietbrowser/log.txt" "$HOME/.local/share/quietbrowser/log.txt"; do
            [ -f "$f" ] && tail -n 80 "$f"
          done
          ps aux | grep -i -E 'chrom|open ' | grep -v grep | head -20
          ls -la "$HOME/Library/Application Support/quietbrowser/chrome-profile" 2>/dev/null | head -20
          true
    env:
      QUIETBROWSER_LOG: "1"
